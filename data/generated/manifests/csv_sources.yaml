manifest_version: 1
description: Planned CSV sources for structured seed data, spreadsheet-style RAG, and PostgreSQL loading.

defaults:
  generated: true
  status: active
  delimiter: ","
  encoding: utf-8

csv_sources:
  - source_id: company-holidays-2026-csv
    title: Company Holidays 2026
    source_path: data/docs/csv/public/company_holidays_2026.csv
    target_table: company_holidays
    department: hr
    permission_profile: public_internal
    index_as_chunks: true
    updated_at: 2026-01-03
    columns:
      - holiday_id
      - region
      - holiday_name
      - date
      - type
      - notes
    sample_queries:
      - What holidays apply in Pakistan?
      - What are the UAE office holidays?

  - source_id: tool-directory-csv
    title: Tool Directory
    source_path: data/docs/csv/public/tool_directory.csv
    target_table: tool_directory
    department: it
    permission_profile: public_internal
    index_as_chunks: true
    updated_at: 2026-02-01
    columns:
      - tool_id
      - name
      - owner_department
      - access_method
      - support_team
      - docs_path
    sample_queries:
      - Who owns GitHub access?
      - Where do I request access to Jira?

  - source_id: office-locations-csv
